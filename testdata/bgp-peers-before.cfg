hostname lab-bgp
!
interface GigabitEthernet0/0
 ip address 198.18.1.1 255.255.255.0
 no shutdown
!
interface Loopback0
 ip address 198.18.0.1 255.255.255.255
!
router bgp 65001
 bgp router-id 198.18.0.1
 neighbor 198.18.1.2 remote-as 65002
 neighbor 198.18.1.2 description uplink-a
 neighbor 198.18.1.3 remote-as 65003
 neighbor 198.18.1.4 remote-as 65004
!
ip route 0.0.0.0 0.0.0.0 198.18.1.254
!
end
